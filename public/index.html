<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Iota</title>
  </head>

  <body
    class="min-h-screen bg-zinc-300 flex items-center justify-center p-4 sm:p-6"
  >
    <main
      class="w-full max-w-lg bg-zinc-100 rounded-2xl shadow-2xl shadow-zinc-500/20 border border-white/70 p-6 sm:p-8 md:p-10"
    >
      <h1 class="text-3xl font-bold tracking-tight text-zinc-800 mb-8 sm:mb-9">
        I<span class="text-zinc-400">ota</span
        ><span class="text-zinc-400 font-normal">.</span>
      </h1>

      <div class="flex flex-col sm:flex-row items-center gap-5 sm:gap-7">
        <div
          class="w-full sm:w-24 md:w-28 h-48 sm:h-24 md:h-28 shrink-0 bg-zinc-200 rounded-2xl flex items-center justify-center overflow-hidden"
        >
          <img
            src="ytchan.png"
            alt="YTchan"
            class="w-36 h-36 sm:w-20 sm:h-20 md:w-24 md:h-24 object-contain"
          />
        </div>

        <div class="w-full min-w-0 flex-1 flex flex-col gap-3">
          <input
            type="text"
            placeholder="Paste YouTube URL"
            class="w-full h-12 px-4 rounded-xl bg-white border border-zinc-300 text-zinc-800 placeholder-zinc-400 outline-none focus:border-zinc-600 focus:ring-4 focus:ring-zinc-400/15 transition-all"
          />

          <button
            class="w-full h-12 rounded-xl bg-zinc-800 hover:bg-zinc-700 active:scale-[0.97] text-zinc-100 font-semibold transition-all duration-200 cursor-pointer shadow-md shadow-zinc-800/15"
          >
            Download
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
